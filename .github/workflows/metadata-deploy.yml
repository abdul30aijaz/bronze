- name: Upload metadata JSONs to Volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          JOB_NAMES_INPUT: ${{ inputs.job_names }}
        run: |
          set -e
          IFS=',' read -ra JOBS <<< "$JOB_NAMES_INPUT"
          for JOB_NAME in "${JOBS[@]}"; do
            JOB_NAME=$(echo "$JOB_NAME" | xargs)

            if [ ! -d "metadata/configs/$JOB_NAME" ]; then
              echo "ERROR: metadata/configs/$JOB_NAME not found in repo"
              exit 1
            fi

            VOLUME_DIR="dbfs:/Volumes/workspace/metadata/mdif_volume/metadata/configs/$JOB_NAME"
            databricks fs mkdir "$VOLUME_DIR"

            for f in metadata/configs/"$JOB_NAME"/*.json; do
              echo "Uploading $f -> $VOLUME_DIR/$(basename "$f")"
              databricks fs cp "$f" "$VOLUME_DIR/$(basename "$f")" --overwrite
            done

            echo "Uploaded $(ls metadata/configs/"$JOB_NAME"/*.json | wc -l) JSON file(s) for $JOB_NAME"
          done
