trigger:
  branches:
    include:
      - dev
      - main
  paths:
    exclude:
      - metadata/*

pool:
  vmImage: ubuntu-latest

variables:
  - group: mars_petcare_mdif_ci_secrets

stages:

# STAGE 1: CI - Run All Checks

- stage: CI_Test
  displayName: "1. CI Checks (pytest · ruff · mypy · bandit · black)"

  jobs:
    - job: RunChecks
      displayName: "Run all quality gates"

      steps:

        - checkout: self
          displayName: "Checkout source code"

        - task: UsePythonVersion@0
          inputs:
            versionSpec: "3.x"
          displayName: "Set Python version"

        - script: |
            echo "Installing CI dependencies..."
            pip install pytest ruff mypy bandit black --quiet
            pytest   --version
            ruff     --version
            mypy     --version
            bandit   --version
            echo "All dependencies installed"
          displayName: "Install CI tools"

        - script: |
            echo "Running pytest..."
            pytest bronze/tests/tests_framework.py -v --tb=short
            echo "pytest passed"
          displayName: "pytest - structure and syntax checks"

        - script: |
            echo "Running ruff linter (non-blocking)..."
            python3 -m ruff check . || true
            echo "ruff complete - remove || true to enforce when ready"
          displayName: "ruff - linting (non-blocking)"

        - script: |
            python3 -m black .
          displayName: "black — code formatting validation"

        - script: |
            echo "Running mypy type checker..."
            find . -name "*.py" -exec sed -i '/^[[:space:]]*%/d' {} \;
            python3 -m mypy . \
              --ignore-missing-imports \
              --no-strict-optional \
              --explicit-package-bases \
              --follow-imports=silent \
              --disable-error-code=name-defined
            echo "mypy passed"
          displayName: "mypy - static type checking"

        - script: |
            echo "Running bandit security scan..."
            python3 -m bandit -r . \
              -ll \
              --skip B108,B608 \
              -x ./metadata \
              --exit-zero
            echo "bandit scan complete"
          displayName: "bandit - security scan"


# STAGE 2: Deploy to DEV

- stage: Deploy_DEV
  displayName: "2. Deploy to DEV Databricks"

  dependsOn: CI_Test

  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranchName'], 'dev')
    )

  variables:
    - group: mars_petcare_mdif_ci_secrets
    - group: mars_petcare_mdif_dev_vars

  jobs:
    - deployment: DeployDEV
      displayName: "Pull latest dev branch into Databricks Repo"

      environment: mdif-development

      strategy:
        runOnce:
          deploy:
            steps:

              - checkout: self
                displayName: "Checkout source code"

              - script: |
                  echo "Installing Databricks CLI..."
                  curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
                  echo "##vso[task.prependpath]/usr/local/bin"
                  echo "Databricks CLI installed - version: $(databricks --version)"
                displayName: "Install Databricks CLI"

              - script: |
                  set -e
                  echo "Validating Databricks connection..."
                  databricks workspace list /
                  echo "Connected to Databricks successfully"
                displayName: "Validate Databricks connection"
                env:
                  DATABRICKS_HOST:      $(workspace-url)
                  ARM_CLIENT_ID:        $(team-sp-client-id)
                  ARM_CLIENT_SECRET:    $(team-sp-client-secret)
                  ARM_TENANT_ID:        $(tenant-id)
                  DATABRICKS_AUTH_TYPE: azure-client-secret

              - script: |
                  set -e
                  echo "Pulling latest code into Databricks Repo..."
                  echo "Repo path : $(REPO_PATH)"
                  echo "Branch    : $(Build.SourceBranchName)"

                  databricks repos update \
                    "$(REPO_PATH)" \
                    --branch "$(Build.SourceBranchName)"

                  echo "DEV repo updated successfully!"
                  echo "Path   : $(REPO_PATH)"
                  echo "Branch : $(Build.SourceBranchName)"
                displayName: "Pull latest into Databricks Repo - DEV"
                env:
                  DATABRICKS_HOST:      $(workspace-url)
                  ARM_CLIENT_ID:        $(team-sp-client-id)
                  ARM_CLIENT_SECRET:    $(team-sp-client-secret)
                  ARM_TENANT_ID:        $(tenant-id)
                  DATABRICKS_AUTH_TYPE: azure-client-secret

# STAGE 3: Deploy to PRE-PROD

- stage: Deploy_PREPROD
  displayName: "3. Deploy to PRE-PROD"

  dependsOn: CI_Test

  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranchName'], 'pre-prod')
    )

  variables:
    - group: mars_petcare_mdif_ci_secrets
    - group: mars_petcare_mdif_dev_vars

  jobs:
    - deployment: DeployPREPROD
      displayName: "Deploy to PRE-PROD"

      environment: mdif-pre-production

      strategy:
        runOnce:
          deploy:
            steps:

              - checkout: self
                displayName: "Checkout source code"

              - script: |
                  echo "Installing Databricks CLI..."
                  curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
                  echo "##vso[task.prependpath]/usr/local/bin"
                  echo "Databricks CLI installed - version: $(databricks --version)"
                displayName: "Install Databricks CLI"

              - script: |
                  set -e
                  echo "Validating Databricks connection..."
                  databricks workspace list /
                  echo "Connected to Databricks successfully"
                displayName: "Validate Databricks connection"
                env:
                  DATABRICKS_HOST:      $(workspace-url)
                  ARM_CLIENT_ID:        $(team-sp-client-id)
                  ARM_CLIENT_SECRET:    $(team-sp-client-secret)
                  ARM_TENANT_ID:        $(tenant-id)
                  DATABRICKS_AUTH_TYPE: azure-client-secret

              - script: |
                  set -e
                  echo "Pulling latest code into Databricks Repo..."
                  echo "Repo path : $(REPO_PATH)"
                  echo "Branch    : $(Build.SourceBranchName)"

                  databricks repos update \
                    "$(REPO_PATH)" \
                    --branch "$(Build.SourceBranchName)"

                  echo "PRE-PROD repo updated successfully!"
                  echo "Path   : $(REPO_PATH)"
                  echo "Branch : $(Build.SourceBranchName)"
                displayName: "Pull latest into Databricks Repo - PREPROD"
                env:
                  DATABRICKS_HOST:      $(workspace-url)
                  ARM_CLIENT_ID:        $(team-sp-client-id)
                  ARM_CLIENT_SECRET:    $(team-sp-client-secret)
                  ARM_TENANT_ID:        $(tenant-id)
                  DATABRICKS_AUTH_TYPE: azure-client-secret

# STAGE 4: Deploy to PROD

- stage: Deploy_PROD
  displayName: "4. Deploy to PROD (Approval Required)"

  dependsOn: CI_Test

  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranchName'], 'main')
    )

  variables:
    - group: mars_petcare_mdif_ci_secrets
    - group: mars_petcare_mdif_prod_vars

  jobs:
    - deployment: DeployPROD
      displayName: "Pull latest main branch into Databricks Repo"

      environment: mdif-production

      strategy:
        runOnce:
          deploy:
            steps:

              - checkout: self
                displayName: "Checkout source code"

              - script: |
                  echo "Installing Databricks CLI..."
                  curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
                  echo "##vso[task.prependpath]/usr/local/bin"
                  echo "Databricks CLI installed - version: $(databricks --version)"
                displayName: "Install Databricks CLI"

              - script: |
                  set -e
                  echo "Validating Databricks connection..."
                  databricks workspace list /
                  echo "Connected to Databricks successfully"
                displayName: "Validate Databricks connection"
                env:
                  DATABRICKS_HOST:      $(workspace-url)
                  ARM_CLIENT_ID:        $(team-sp-client-id)
                  ARM_CLIENT_SECRET:    $(team-sp-client-secret)
                  ARM_TENANT_ID:        $(tenant-id)
                  DATABRICKS_AUTH_TYPE: azure-client-secret

              - script: |
                  set -e
                  echo "Pulling latest code into Databricks Repo..."
                  echo "Repo path : $(REPO_PATH)"
                  echo "Branch    : $(Build.SourceBranchName)"

                  databricks repos update \
                    "$(REPO_PATH)" \
                    --branch "$(Build.SourceBranchName)"

                  echo "PROD repo updated successfully!"
                  echo "Path   : $(REPO_PATH)"
                  echo "Branch : $(Build.SourceBranchName)"
                displayName: "Pull latest into Databricks Repo - PROD"
                env:
                  DATABRICKS_HOST:      $(workspace-url)
                  ARM_CLIENT_ID:        $(team-sp-client-id)
                  ARM_CLIENT_SECRET:    $(team-sp-client-secret)
                  ARM_TENANT_ID:        $(tenant-id)
                  DATABRICKS_AUTH_TYPE: azure-client-secret